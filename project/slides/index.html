<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHA Slides — Index</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--saha-cream); font-family: var(--font-support); }
  h1 { font-family: var(--font-display-en); color: var(--saha-crimson); text-transform: uppercase; letter-spacing: -0.01em; font-size: 56px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  a { display: block; border: 2px solid var(--saha-crimson); box-shadow: 6px 6px 0 var(--saha-black); text-decoration: none; color: var(--saha-crimson); overflow: hidden; }
  a iframe { width: 100%; aspect-ratio: 16/9; border: 0; pointer-events: none; transform: scale(0.5); transform-origin: top left; width: 200%; height: 200%; }
  a .meta { padding: 10px 14px; text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; border-top: 2px solid var(--saha-crimson); background: var(--saha-cream); }
</style>
</head>
<body>
  <h1>Sample Slides</h1>
  <div class="grid">
    <a href="title.html"><iframe src="title.html"></iframe><div class="meta">Title</div></a>
    <a href="section.html"><iframe src="section.html"></iframe><div class="meta">Section · Crimson</div></a>
    <a href="menu.html"><iframe src="menu.html"></iframe><div class="meta">Menu</div></a>
    <a href="quote.html"><iframe src="quote.html"></iframe><div class="meta">Big Quote</div></a>
    <a href="specs.html"><iframe src="specs.html"></iframe><div class="meta">Specs</div></a>
  </div>
</body>
</html>
