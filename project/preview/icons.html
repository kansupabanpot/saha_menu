<!doctype html>

<title>SAHA — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--saha-cream); font-family: var(--font-support); }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .icon {
    width: 36px; height: 36px;
    color: var(--saha-crimson);
    stroke-width: 2;
  }
  .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--saha-ink-soft);
    margin-top: 14px;
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .nm { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--saha-ink-soft); }
</style>
</head>

  <div class="row">
