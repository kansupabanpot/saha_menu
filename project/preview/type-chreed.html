<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>SAHA — Chreed</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--saha-cream); }
  .specimen {
    font-family: var(--font-display-en);
    color: var(--saha-crimson);
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 0.9;
    font-size: 96px;
    margin: 0;
  }
  .row { display: flex; align-items: baseline; gap: 24px; margin-top: 14px; }

    color: var(--saha-crimson);
    text-transform: uppercase;
    font-size: 32px;
    letter-spacing: -0.01em;
  }
  .meta {
    font-family: var(--font-support);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--saha-ink-soft);
  }

</head>
<body>
  <div class="specimen">SAHA</div>
  <div class="row">
    <div class="small">Cut to order</div>
