<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHA — Derived Tints</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--saha-cream); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw {
    aspect-ratio: 1 / 1;
    border: 2px solid var(--saha-black);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
    font-family: var(--font-support);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
  }
  .sw .h { font-size: 10px; opacity: 0.85; }
  .label { font-family: var(--font-support); text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; color: var(--saha-ink-soft); margin-top: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw" style="background:#ECE4B0; color:#8B2020"><div>Cream Deep</div><div class="h">#ECE4B0</div></div>
    <div class="sw" style="background:#D9CE8A; color:#8B2020"><div>Cream Edge</div><div class="h">#D9CE8A</div></div>
    <div class="sw" style="background:#A33434; color:#F5F0C8"><div>Crimson Hi</div><div class="h">#A33434</div></div>
    <div class="sw" style="background:#6A1818; color:#F5F0C8"><div>Crimson Ink</div><div class="h">#6A1818</div></div>
    <div class="sw" style="background:#3A2E25; color:#F5F0C8"><div>Ink Soft</div><div class="h">#3A2E25</div></div>
  </div>
  <div class="label">Hover · Press · Body-text variants. Use sparingly.</div>
</body>
</html>
