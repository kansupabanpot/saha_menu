<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHA — Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--saha-cream); font-family: var(--font-support); }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .bar { background: var(--saha-crimson); height: 16px; }
  .name { width: 60px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--saha-ink-soft); }
  .px { width: 60px; font-size: 11px; color: var(--saha-crimson); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="row"><div class="name">s-1</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
  <div class="row"><div class="name">s-2</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
  <div class="row"><div class="name">s-3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
  <div class="row"><div class="name">s-4</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><div class="name">s-5</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><div class="name">s-6</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
  <div class="row"><div class="name">s-7</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
  <div class="row"><div class="name">s-8</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
  <div class="row"><div class="name">s-9</div><div class="bar" style="width:96px"></div><div class="px">96 px</div></div>
</body>
</html>
