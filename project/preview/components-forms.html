<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHA — Form Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--saha-cream); font-family: var(--font-support); display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--saha-crimson); }
  input, select {
    background: var(--saha-cream-deep);
    border: 2px solid var(--saha-crimson);
    color: var(--saha-crimson);
    font-family: var(--font-support);
    font-size: 15px;
    letter-spacing: 0.06em;
    padding: 10px 12px;
    outline: none;
  }
  input:focus, select:focus { box-shadow: 4px 4px 0 var(--saha-black); border-color: var(--saha-black); }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--saha-crimson); text-transform: uppercase; letter-spacing: 0.08em; }
  .box { width: 18px; height: 18px; border: 2px solid var(--saha-crimson); background: var(--saha-cream); display: inline-block; position: relative; }
  .box.checked { background: var(--saha-crimson); }
  .box.checked::after { content: "✕"; position: absolute; inset: 0; color: var(--saha-cream); font-size: 14px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <label><span class="lbl">Name on reservation</span><input value="Suchada P." /></label>
  <label><span class="lbl">Cut</span><select><option>Ribeye 350g</option><option>Tomahawk 1.2kg</option></select></label>
  <div class="check"><span class="box checked"></span> Send confirmation by SMS</div>
</body>
</html>
