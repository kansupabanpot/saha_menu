<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHA — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--saha-cream); display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-support);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 14px;
    padding: 12px 22px;
    border: 2px solid var(--saha-black);
    box-shadow: 4px 4px 0 var(--saha-black);
    background: var(--saha-crimson);
    color: var(--saha-cream);
    cursor: pointer;
    transition: transform 120ms cubic-bezier(.2,.7,.2,1), box-shadow 120ms;
  }
  .btn:hover { background: #A33434; }
  .btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--saha-black); }
  .btn-secondary { background: var(--saha-cream); color: var(--saha-crimson); border-color: var(--saha-crimson); box-shadow: 4px 4px 0 var(--saha-crimson); }
  .btn-secondary:hover { background: #ECE4B0; }
  .btn-secondary:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--saha-crimson); }
  .btn-ghost {
    background: transparent; color: var(--saha-crimson); box-shadow: none;
    border: 2px solid var(--saha-crimson);
  }
  .btn-ghost:hover { background: var(--saha-crimson); color: var(--saha-cream); }
  .lbl { font-family: var(--font-support); text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px; color: var(--saha-ink-soft); }
</style>
</head>
<body>
  <div class="row">
    <button class="btn">Order Now</button>
    <button class="btn btn-secondary">View Menu</button>
    <button class="btn btn-ghost">Reserve</button>
  </div>
  <div class="lbl">Default · Secondary · Ghost — press translates 2/2 toward shadow</div>
</body>
</html>
