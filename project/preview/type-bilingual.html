<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHA — Bilingual Pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--saha-cream); display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .pair { text-align: center; }
  .pair .en {
    font-family: var(--font-display-en);
    color: var(--saha-crimson);
    text-transform: uppercase;
    letter-spacing: -0.01em;
    font-size: 56px;
    line-height: 0.95;
  }
  .pair .th {
    font-family: var(--font-display-th);
    color: var(--saha-crimson);
    font-size: 28px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-top: 4px;
  }
  .rule {
    width: 80px;
    height: 2px;
    background: var(--saha-crimson);
    margin: 6px auto;
  }
  .meta {
    font-family: var(--font-support);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 11px;
    color: var(--saha-ink-soft);
  }
</style>
</head>
<body>
  <div class="pair">
    <div class="en">The Butcher's Table</div>
    <div class="rule"></div>
    <div class="th">โต๊ะของช่างเขียง</div>
  </div>
  <div class="meta">Chreed on top · Tannakone below · equal visual weight</div>
</body>
</html>
