<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAHA — Radii & Borders</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--saha-cream); font-family: var(--font-support); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 70px; height: 70px; background: var(--saha-cream); border: 2px solid var(--saha-crimson); }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--saha-ink-soft); }
  .val { font-size: 11px; font-family: ui-monospace, monospace; color: var(--saha-crimson); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:0"></div><div class="lbl">r-0 · square</div><div class="val">0px (default)</div></div>
    <div class="cell"><div class="box" style="border-radius:2px"></div><div class="lbl">r-1</div><div class="val">2px</div></div>
    <div class="cell"><div class="box" style="border-radius:4px"></div><div class="lbl">r-2</div><div class="val">4px (max)</div></div>
    <div class="cell"><div class="box" style="border-radius:999px"></div><div class="lbl">r-pill</div><div class="val">badges only</div></div>
    <div class="cell"><div class="box" style="height: 12px; border-width: 1px"></div><div class="lbl">bw-hair</div><div class="val">1px</div></div>
    <div class="cell"><div class="box" style="height: 12px; border-width: 2px"></div><div class="lbl">bw-rule</div><div class="val">2px</div></div>
    <div class="cell"><div class="box" style="height: 12px; border-width: 4px"></div><div class="lbl">bw-heavy</div><div class="val">4px</div></div>
    <div class="cell"><div class="box" style="height: 12px; border-width: 6px"></div><div class="lbl">bw-stamp</div><div class="val">6px</div></div>
  </div>
</body>
</html>
